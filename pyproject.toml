[project]
name = "object-aligner"
version = "0.1.0"
description = "Object alignment and matching library"
readme = "README.md"
authors = [
    { name = "Jan Drchal", email = "drchajan@fel.cvut.cz" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "rapidfuzz",
    "jsonschema",
    "scipy",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5,<9.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
