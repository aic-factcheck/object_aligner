# Top-K prescriptive feedback templates — "gepa"-style baseline used by
# aligner.feedback() and aligner.metric(generate_feedback=True). Rendered
# via Python str.format(); placeholder names below match each key's entry
# in _FEEDBACK_PLACEHOLDERS (src/object_aligner/feedback.py).
#
# Override individual keys by passing feedback_templates={...} to
# ObjectAligner(...) or by maintaining your own TOML file and loading it
# with load_templates_from_toml().
#
# For the compact-style overlay see feedback.compact.toml.

# Placeholders: score, score_pct
"feedback.intro.perfect" = "The prediction perfectly matches the gold (score 1.00)."

# Placeholders: score, score_pct, deficit, deficit_pct, n_shown, n_total
"feedback.intro.imperfect" = "The prediction scored {score:.2f} (deficit {deficit:.2f}). Top {n_shown} of {n_total} fix locations:\n"

# Placeholders: rank, path, gold, pred, score_delta, score_delta_pct
"feedback.op.primitive_replace" = "{rank}. {path}: expected {gold}, got {pred}. Fixing this recovers +{score_delta:.3f}."

# Placeholders: rank, list_path, gold, pred, score_delta, score_delta_pct
"feedback.op.primitive_replace_reorder" = "{rank}. inside list {list_path}: replace item {pred} with {gold}. Fixing this recovers +{score_delta:.3f}."

# Placeholders: rank, path, key, gold, score_delta, score_delta_pct
"feedback.op.key_add" = '{rank}. {path}: missing key "{key}" with value {gold}. Adding it recovers +{score_delta:.3f}.'

# Placeholders: rank, path, key, pred, score_delta, score_delta_pct
"feedback.op.key_remove" = '{rank}. {path}: extraneous key "{key}" (value {pred}). Removing it recovers +{score_delta:.3f}.'

# Placeholders: rank, gold_path, pred_path, gold_key, pred_key, gold, score_delta, score_delta_pct
"feedback.op.key_rename_add" = '{rank}. rename key "{pred_key}" -> "{gold_key}" at {gold_path} (value {gold}). Fixing this recovers +{score_delta:.3f}.'

# Default empty — silenced; the paired key_rename_add carries the line.
# Override to a non-empty string to render both halves.
# Placeholders (if you customize): rank, pred_path, pred_key, pred
"feedback.op.key_rename_remove" = ""

# Placeholders: rank, path, gold, score_delta, score_delta_pct
"feedback.op.list_item_add" = "{rank}. {path}: missing list item {gold}. Adding it recovers +{score_delta:.3f}."

# Placeholders: rank, path, pred, score_delta, score_delta_pct
"feedback.op.list_item_remove" = "{rank}. {path}: extraneous list item {pred}. Removing it recovers +{score_delta:.3f}."

# Placeholders: rank, list_path, gold, score_delta, score_delta_pct
"feedback.op.list_item_missing" = "{rank}. {list_path}: list is missing item {gold}. Adding it recovers +{score_delta:.3f}."

# Placeholders: rank, list_path, pred, score_delta, score_delta_pct
"feedback.op.list_item_excess" = "{rank}. {list_path}: list has extraneous item {pred}. Removing it recovers +{score_delta:.3f}."

# Placeholders: rank, path, pred, value, score_delta, score_delta_pct
# `value` is the bijection-resolved replacement in the prediction's own
# id space (never a gold-space id), so the line is directly actionable
# without leaking the gold object.
"feedback.op.ref_fix" = "{rank}. {path}: wrong reference (got {pred}, change to {value}). Fixing this recovers +{score_delta:.3f}."

# Placeholders: rank, path, pred, score_delta, score_delta_pct
# Emitted when the gold-side referent has no counterpart in the
# prediction under the derived bijection. The fix cannot be made by
# replacement alone — a sibling list_item_missing op adds the missing
# entity. No gold-space id is surfaced.
"feedback.op.ref_fix_no_target" = "{rank}. {path}: reference {pred} cannot be resolved against any entity in the prediction. Recovers +{score_delta:.3f}."

# --- Semantic referential feedback (opt-in) ---------------------------------
# Only used when referential_feedback="semantic" (constructor or per-call). The
# default "literal" mode never touches these keys, so default output stays
# byte-identical. The renderer composes a ref op line from the fragments below
# (target / used / relation clauses), then formats one of the op skeletons. If
# the gold endpoint has no discriminating property, OA falls back to the literal
# "feedback.op.ref_fix" / "feedback.op.ref_fix_no_target" line for that op.
#
# Placeholders: key, value  — one rendered endpoint property ("concept 'go-02'").
"feedback.refsem.prop" = "{key} {value}"
# Placeholders: relation_label  — prefix for the edge label; trailing space is
# intentional ("this ':ARG0' reference ..."). Empty when the edge has no label.
"feedback.refsem.relation" = "{relation_label} "
# Placeholders: scope, gold_props  — the gold endpoint, alignment certain.
"feedback.refsem.target" = "the {scope} with {gold_props}"
# Placeholders: scope, gold_props  — hedge when a property-twin shares the props.
"feedback.refsem.target_ambiguous" = "a {scope} with {gold_props} (but several match)"
# Placeholders: scope, pred_props  — the wrong endpoint the prediction used.
"feedback.refsem.used" = ", not the {scope} you used ({pred_props})"
# (no placeholders) — the predicted reference resolves to no definer.
"feedback.refsem.used_dangling" = ", but the reference you wrote resolves to nothing in your output"
# Placeholders: rank, path, scope, relation, target, used, score_delta, score_delta_pct
"feedback.op.ref_fix.semantic" = "{rank}. {path}: this {relation}reference should point to {target}{used}. Fixing this recovers +{score_delta:.3f}."
# Placeholders: rank, path, scope, relation, target, score_delta, score_delta_pct
"feedback.op.ref_fix_no_target.semantic" = "{rank}. {path}: this {relation}reference should point to {target}, but your output has no such {scope}. Recovers +{score_delta:.3f}."

# Placeholders: rank, path, score_delta, score_delta_pct
"feedback.op.subtree_replace" = "{rank}. {path}: subtree differs. Replacing it recovers +{score_delta:.3f}."

# Placeholders: rank, path, gold, pred, score_delta, score_delta_pct
"feedback.op.null_value_replace" = "{rank}. {path}: null/value mismatch (expected {gold}, got {pred}). Fixing this recovers +{score_delta:.3f}."

# Placeholders: rank, path, confidence, confidence_pct
# Diagnostic-only op kind, emitted when include_pairing_ambiguous=True.
# It is *not* a fix — the value of this entry is in telling the optimizer
# that the alignment itself was uncertain at this path, so chasing the
# fixes underneath it may not improve the score.
"feedback.op.pairing_ambiguous" = "~ {path}: pairing between gold and predicted items was ambiguous (confidence {confidence_pct:.0f}%). Make these items more distinctive before fixing deeper field-level errors."

# (no placeholders) — diagnostics-section intro printed before any
# pairing_ambiguous entries when at least one fires.
"feedback.diagnostics.intro" = "\nDiagnostic notes (low-confidence pairings):"

# Placeholders: dominant_kind, dominant_kind_human, dominant_fraction, dominant_fraction_pct
"feedback.synthesis.single_dominant" = "\nFocus on {dominant_kind_human} errors — they account for {dominant_fraction_pct:.0f}% of the deficit shown."

# Placeholders: top_kinds
"feedback.synthesis.mixed" = "\nThe deficit is spread across multiple issue types ({top_kinds})."

# Placeholders: score, score_pct
"feedback.empty" = "The prediction scored {score:.2f}; no individually significant fix locations under the current filter."

# Placeholders: path, message
"feedback.validation_error" = "Prediction failed schema validation at {path}: {message}"
