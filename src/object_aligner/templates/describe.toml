# Whole-tree description templates used by ObjectAligner.describe() and by
# ObjectAligner.metric() when generate_description=True. Substituted via
# Python str.format() — placeholder names below match each key's entry in
# _DESCRIPTION_PLACEHOLDERS (src/object_aligner/describe.py).
#
# Override individual keys by passing description_templates={...} to
# ObjectAligner(...) or by maintaining your own TOML file and loading it
# with load_templates_from_toml().
#
# All values are TOML "basic" (double-quoted) strings so that `\n` is
# interpreted as a real newline. Embedded `"` characters are escaped as `\"`.

# (no placeholders)
"describe.intro.perfect" = "The predicted output perfectly matches the gold."

# Placeholders: score, score_pct
"describe.intro.imperfect" = "The predicted output scores overall {score_pct}, let us align the predicted output to the gold and analyze the differences:\n"

# Placeholders: indent, gold, pred, score, score_pct
"describe.item.match"     = "{indent}The predicted value \"{pred}\" exactly matches the gold.\n"
"describe.item.mismatch"  = "{indent}The predicted value \"{pred}\" does not match the gold \"{gold}\" (score={score_pct}).\n"

# Placeholders: indent, pred, score, score_pct
# Ref rows speak in pred's id space only — gold-space ids are an internal
# implementation detail of the bijection and never appear here.
"describe.ref.match"      = "{indent}The predicted reference \"{pred}\" matches under the inferred id mapping.\n"
# Placeholders: indent, pred, value, score, score_pct
# `value` is the bijection-resolved pred-space id this reference should
# point to.
"describe.ref.mismatch"   = "{indent}The predicted reference \"{pred}\" should be \"{value}\" under the inferred id mapping (score={score_pct}).\n"
# Placeholders: indent, pred, score, score_pct
# Emitted when the gold-side referent has no counterpart in the prediction
# under the derived bijection. No replacement value can be surfaced.
"describe.ref.no_target"  = "{indent}The predicted reference \"{pred}\" cannot be resolved under the inferred id mapping (score={score_pct}).\n"

# id rows are intentionally empty: id fields exist for referential bookkeeping
# and should not appear in human-readable description output.
"describe.id.match"       = ""
"describe.id.mismatch"    = ""

# Placeholders: indent, gold, pred, score, score_pct
# Emitted when one or both of gold/pred is null. The "match" row covers the
# both-null case (score 1.0); "mismatch" covers asymmetric null/value cases
# whose score is the schema's `nullScore`.
"describe.null.match"     = "{indent}Both the predicted and gold values are null here.\n"
"describe.null.mismatch"  = "{indent}The predicted value \"{pred}\" does not match the gold \"{gold}\" (null/value mismatch, score={score_pct}).\n"

# Placeholders: indent, score, score_pct
"describe.list.match"     = "{indent}The predicted list perfectly matches the gold one:\n"
"describe.list.mismatch"  = "{indent}The predicted list scores {score_pct}:\n"

# Placeholders: indent, gold, pred, score, score_pct
"describe.list.excess"    = "{indent}The predicted list item \"{pred}\" is excessive, it was not in the gold.\n"
"describe.list.missing"   = "{indent}The predicted output misses the \"{gold}\" list item from the gold.\n"

# Placeholders: indent, confidence, confidence_pct, n_gold, n_pred
# Opt-in diagnostic — emitted only when render_description(include_ambiguous=True)
# and the list's confidence falls below ambiguity_threshold. Inserted before the
# normal list walk; not a replacement.
"describe.list.ambiguous" = "{indent}NOTE: alignment between {n_gold} gold and {n_pred} predicted list items was ambiguous (confidence {confidence_pct}).\n"

# Placeholders: indent, score, score_pct
"describe.dict.match"     = "{indent}The predicted dictionary perfectly matches the gold one:\n"
"describe.dict.mismatch"  = "{indent}The predicted dictionary scores {score_pct}:\n"

# Placeholders: indent, confidence, confidence_pct
# Opt-in diagnostic — emitted only when render_description(include_ambiguous=True)
# and the dict's confidence falls below ambiguity_threshold.
"describe.dict.ambiguous" = "{indent}NOTE: dict key alignment was ambiguous (confidence {confidence_pct}).\n"

# Placeholders: indent, gold, pred, score, score_pct
"describe.dict.key.match"    = "{indent}KEY = The predicted key \"{pred}\" exactly matches the gold.\n"
"describe.dict.key.mismatch" = "{indent}KEY = The predicted key \"{pred}\" does not match the gold \"{gold}\" (score={score_pct}).\n"

# Placeholders: indent
"describe.dict.value.prefix" = "{indent}VALUE = "

# Placeholders: path, message
"describe.validation_error" = "JSON Schema validation failed for path=\"{path}\". Error message: {message}."
